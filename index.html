<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    }
    h1 {
      margin: 0;
      padding: 0 16px;
      text-align: center;
      font-family: 'Pacifico', cursive;
      font-weight: 400;
      font-size: clamp(3.5rem, 12vw, 9rem);
      background: linear-gradient(90deg, #f97316, #ec4899, #8b5cf6, #06b6d4, #f97316);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35));
    }
    @keyframes shimmer {
      to { background-position: 300% 0; }
    }
    .bang {
      position: relative;
    }
    .dot {
      position: absolute;
      left: -0.05em;
      top: 1.2em;
      width: 0.42em;
      height: 0.42em;
      border-radius: 50%;
      background: linear-gradient(90deg, #f97316, #ec4899, #8b5cf6, #06b6d4, #f97316);
      background-size: 300% 100%;
      animation: shimmer 6s linear infinite;
    }
    .dot svg {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h1>Hello World<span class="bang">!<span class="dot" aria-hidden="true"><svg viewBox="0 0 48 48">
    <circle cx="16" cy="19" r="3.5" fill="#3b1d7a"/>
    <circle cx="32" cy="19" r="3.5" fill="#3b1d7a"/>
    <path d="M12 28 Q24 41 36 28" fill="none" stroke="#3b1d7a" stroke-width="4" stroke-linecap="round"/>
  </svg></span></span></h1>
</body>
</html>
